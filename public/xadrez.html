<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4d3fbf">
<title>Xadrez - Pradaria</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="estilo.css?v=23">
<link rel="stylesheet" href="tabuleiro.css?v=5">
</head>
<body class="pag-tabuleiro">
<div id="fundo" aria-hidden="true"></div>

<!-- escolher como jogar -->
<div id="x-menu" class="janela">
  <div class="caixa">
    <div class="titulo-jogo"><span data-icone="xadrez"></span><span>Xadrez</span></div>
    <p class="sub centro">Como você quer jogar?</p>
    <h3>Contra o computador</h3>
    <div class="niveis" role="radiogroup" aria-label="Nível do computador">
      <button class="bt nivel" data-nivel="1" type="button" role="radio">Fácil<small>uns 400 pontos</small></button>
      <button class="bt nivel" data-nivel="2" type="button" role="radio">Médio<small>uns 800 pontos</small></button>
      <button class="bt nivel" data-nivel="3" type="button" role="radio">Difícil<small>uns 1200 pontos</small></button>
    </div>
    <div class="niveis" role="radiogroup" aria-label="Sua cor">
      <button class="bt cor-peca" data-cor="w" type="button" role="radio">Brancas</button>
      <button class="bt cor-peca" data-cor="b" type="button" role="radio">Pretas</button>
    </div>
    <button class="bt verde grande" id="bt-computador" type="button"><span data-icone="engrenagem"></span>Jogar contra o computador</button>
    <button class="bt amarelo" id="bt-continuar" type="button" hidden><span data-icone="relogio"></span>Continuar a partida</button>
    <h3>Treinar</h3>
    <button class="bt amarelo grande" id="bt-problemas" type="button"><span data-icone="alvo"></span>Problemas de xadrez</button>
    <p class="sub centro" id="x-prob-pontos"></p>
    <h3>Online</h3>
    <div class="niveis ritmos" role="radiogroup" aria-label="Ritmo da partida">
      <button class="bt ritmo" data-ritmo="1+0" type="button" role="radio">Bullet<small>1 min</small></button>
      <button class="bt ritmo" data-ritmo="3+2" type="button" role="radio">Blitz<small>3 min +2s</small></button>
      <button class="bt ritmo" data-ritmo="10+0" type="button" role="radio">Rápida<small>10 min</small></button>
      <button class="bt ritmo" data-ritmo="" type="button" role="radio">Sem relógio<small>com calma</small></button>
    </div>
    <p class="sub centro" id="x-meus-pontos" hidden></p>
    <button class="bt verde grande" id="bt-procurar" type="button"><span data-icone="mira"></span>Procurar adversário</button>
    <div class="niveis" role="radiogroup" aria-label="Partida com amigo">
      <button class="bt tipo-amigo" data-tipo="amistosa" type="button" role="radio">Amistosa</button>
      <button class="bt tipo-amigo" data-tipo="pontos" type="button" role="radio">Valendo pontos</button>
    </div>
    <button class="bt verde grande" id="bt-amigo" type="button"><span data-icone="amigos"></span>Chamar um amigo</button>
    <p class="sub" id="x-sem-conta" hidden>Para jogar com amigos, <a href="/">entre na sua conta</a>.</p>
    <button class="bt" id="bt-perfil" type="button"><span data-icone="pessoa"></span>Meu perfil e partidas</button>
    <p id="x-erro" class="erro"></p>
    <a class="bt fraco" href="/" id="bt-jogos"><span data-icone="voltar"></span>Todos os jogos</a>
  </div>
</div>

<!-- perfil: pontos e últimas partidas -->
<div id="x-perfil" class="janela" hidden>
  <div class="caixa">
    <h2>Meu xadrez</h2>
    <div class="perfil-pontos" id="perfil-pontos"></div>
    <h3>Últimas partidas</h3>
    <div class="perfil-lista" id="perfil-lista"></div>
    <button class="bt" id="bt-perfil-fechar" type="button"><span data-icone="voltar"></span>Voltar</button>
  </div>
</div>

<!-- análise da partida -->
<main id="x-analise" hidden>
  <div class="barra-topo">
    <button class="redondo" id="a-voltar" aria-label="Sair da análise"><span data-icone="voltar"></span></button>
    <div id="a-status" class="status-analise" aria-live="polite">Análise</div>
    <button class="redondo" id="a-girar" aria-label="Virar o tabuleiro"><span data-icone="recarregar"></span></button>
  </div>
  <div class="jogador-linha"><span class="n" id="a-cima"></span></div>
  <div class="a-nota" aria-label="Quem está melhor"><div class="a-nota-brancas" id="a-nota-brancas"></div><span id="a-nota-txt"></span></div>
  <div id="a-tabuleiro" class="tabuleiro" aria-label="Tabuleiro da análise"></div>
  <div class="jogador-linha"><span class="n" id="a-baixo"></span></div>
  <p class="a-info" id="a-info" aria-live="polite"></p>
  <div class="linha-bts a-nav">
    <button class="bt" id="a-inicio" type="button" aria-label="Começo">|&lt;</button>
    <button class="bt" id="a-ant" type="button">Anterior</button>
    <button class="bt verde" id="a-prox" type="button">Próximo</button>
    <button class="bt" id="a-fim" type="button" aria-label="Fim">&gt;|</button>
  </div>
  <div id="a-lances" class="lances analise" aria-label="Lances (toque para ver)"></div>
  <div class="a-precisao" id="a-precisao"></div>
</main>

<!-- procurando adversário -->
<div id="x-busca" class="janela" hidden>
  <div class="caixa">
    <h2>Procurando adversário…</h2>
    <p class="sub centro" id="busca-txt"></p>
    <p class="busca-tempo" id="busca-tempo" aria-live="off">0:00</p>
    <button class="bt" id="bt-busca-cancelar" type="button">Cancelar</button>
  </div>
</div>

<!-- a partida -->
<main id="x-jogo" hidden>
  <div class="barra-topo">
    <button class="redondo" id="bt-sair" aria-label="Sair da partida"><span data-icone="voltar"></span></button>
    <div id="x-status" aria-live="polite"></div>
    <button class="redondo" id="bt-girar" aria-label="Virar o tabuleiro"><span data-icone="recarregar"></span></button>
  </div>
  <div class="jogador-linha" id="x-cima"></div>
  <div id="tabuleiro" role="grid" aria-label="Tabuleiro de xadrez"></div>
  <div class="jogador-linha" id="x-baixo"></div>
  <div id="x-lances" class="lances" aria-label="Lances da partida"></div>
  <div class="linha-bts" id="x-botoes">
    <button class="bt" id="bt-empate" type="button" hidden>Propor empate</button>
    <button class="bt" id="bt-desistir" type="button">Desistir</button>
    <button class="bt verde" id="bt-vitoria" type="button" hidden>Pedir a vitória</button>
    <button class="bt" id="bt-prob-resposta" type="button" hidden>Ver a resposta</button>
    <button class="bt verde" id="bt-prob-prox" type="button" hidden>Próximo problema</button>
    <button class="bt verde" id="bt-chamar" type="button" hidden><span data-icone="acenar"></span>Chamar amigo</button>
  </div>
</main>

<!-- escolher a peça da promoção -->
<div id="promo" class="janela" hidden>
  <div class="caixa">
    <h2>Virar o peão em…</h2>
    <div class="promo-pecas" id="promo-pecas"></div>
  </div>
</div>

<!-- fim da partida -->
<div id="x-fim" class="janela" hidden>
  <div class="caixa">
    <h2 id="fim-titulo"></h2>
    <p class="sub centro" id="fim-txt"></p>
    <p class="fim-pontos" id="fim-pontos" hidden></p>
    <button class="bt verde grande" id="bt-revanche" type="button">Jogar de novo</button>
    <p class="sub centro" id="fim-espera" hidden></p>
    <button class="bt amarelo" id="bt-analisar" type="button"><span data-icone="lupa"></span>Analisar a partida</button>
    <button class="bt" id="bt-ver" type="button">Ver o tabuleiro</button>
    <button class="bt" id="bt-menu-fim" type="button">Outro jeito de jogar</button>
  </div>
</div>

<div id="aviso"></div>
<script type="module" src="js/xadrez.js?v=9"></script>
<div class="marca-dagua" aria-hidden="true">Ryan Krano</div>
</body>
</html>
