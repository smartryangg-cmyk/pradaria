# Worker só com a sala multijogador (Durable Object). O site (Pages) fala com ela pelo binding SALA.
name = "pradaria-sala"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

[[durable_objects.bindings]]
name = "SALA"
class_name = "Sala"

# celular como controle da TV (public/controle.html): só repassa recados, não guarda nada
[[durable_objects.bindings]]
name = "CONTROLE"
class_name = "Controle"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Controle"]

# saguão da plataforma: amigos online e convites (src/lobby.js)
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Lobby"]
