plugins { id "com.android.application" }

// App do tablet/celular: o jogo inteiro vai dentro do APK (módulo :pacote) e abre sem internet.
// A chave de assinatura vem do GitHub Actions (segredos ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_SENHA).
// É a mesma chave e o mesmo pacote (dev.pradaria.jogo) do app antigo: instala por cima.
def chave = System.getenv("ANDROID_KEYSTORE_ARQUIVO")
def senha = System.getenv("ANDROID_KEYSTORE_SENHA")

android {
    namespace "dev.pradaria.jogo"
    compileSdk 35
    defaultConfig {
        applicationId "dev.pradaria.jogo"
        minSdk 21
        targetSdk 35
        versionCode Integer.parseInt(System.getenv("VERSAO_CODIGO") ?: "1")
        versionName System.getenv("VERSAO_NOME") ?: "1.0"
        // só no teste automático (emulador): deixa o teste controlar o WebView
        resValue "bool", "depurar", System.getenv("DEPURAR_WEB") == "1" ? "true" : "false"
    }
    signingConfigs {
        release {
            if (chave) {
                storeFile file(chave)
                storePassword senha
                keyAlias "pradaria"
                keyPassword senha
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(":pacote")
}
