# Publica o jogo no Cloudflare a cada push no main.
# Precisa dos segredos do repositório: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
name: publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Conferir segredos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os segredos CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions"; exit 1
          fi
      - name: Banco D1 (cria se não existir)
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="pradaria-db");console.log(d?d.uuid:"")')
          if [ -z "$ID" ]; then
            npx wrangler d1 create pradaria-db
            ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(l.find(x=>x.name==="pradaria-db").uuid)')
          fi
          echo "D1: $ID"
          sed -i "s/COLOCAR_ID_DO_D1/$ID/" wrangler.toml
          npx wrangler d1 execute pradaria-db --remote --file db/schema.sql
      - name: Sala multijogador (Worker + Durable Object)
        run: cd sala-worker && npx wrangler deploy
      - name: Site (Cloudflare Pages)
        run: |
          npx wrangler pages project create pradaria --production-branch main 2>/dev/null || echo 'Projeto Pages já existe'
          npx wrangler pages deploy --branch main --commit-dirty=true
