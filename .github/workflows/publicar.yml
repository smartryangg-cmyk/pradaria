# Publica o jogo no Cloudflare a cada push no main.
# Precisa dos segredos do repositório: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
name: publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # para contar os commits (número da versão)
      - name: Versão do jogo (aparece na tela inicial e na pausa)
        run: |
          N=$(git rev-list --count HEAD); H=$(git rev-parse --short HEAD); D=$(TZ=America/Sao_Paulo date +%d/%m/%Y)
          printf "// Gerado na publicação (publicar.yml).\nexport const VERSAO = { numero: '%s', hash: '%s', data: '%s' };\n" "$N" "$H" "$D" > public/js/versao.js
          cat public/js/versao.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Conferir segredos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os segredos CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions"; exit 1
          fi
      - name: Conferir acesso à Cloudflare
        run: npx wrangler whoami
      - name: Banco D1 (cria se não existir)
        run: |
          set -o pipefail
          ID=$(npx wrangler d1 list --json 2>/dev/null | sed -n '/^\[/,$p' | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="pradaria-db");console.log(d?d.uuid:"")')
          if [ -z "$ID" ]; then
            npx wrangler d1 create pradaria-db
            set -o pipefail
          ID=$(npx wrangler d1 list --json 2>/dev/null | sed -n '/^\[/,$p' | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(l.find(x=>x.name==="pradaria-db").uuid)')
          fi
          echo "D1: $ID"
          sed -i "s/COLOCAR_ID_DO_D1/$ID/" wrangler.toml
          npx wrangler d1 execute pradaria-db --remote --file db/schema.sql
      - name: Sala multijogador (Worker + Durable Object)
        run: cd sala-worker && npx wrangler deploy
      - name: Site (Cloudflare Pages)
        run: |
          npx wrangler pages project create pradaria --production-branch main 2>/dev/null || echo 'Projeto Pages já existe'
          for i in 1 2 3 4 5; do
            npx wrangler pages deploy --branch main --commit-dirty=true && break
            [ $i = 5 ] && exit 1
            echo "Cloudflare instável, tentando de novo em $((i*20))s"; sleep $((i*20))
          done
      - name: Conferir o jogo no ar
        run: |
          sleep 20
          curl -sf https://pradaria.pages.dev/ -o /dev/null && echo "site ok"
          curl -sf https://pradaria.pages.dev/js/versao.js | tee /dev/stderr | grep -q "$(git rev-parse --short HEAD)" && echo "versão no ar ok" || echo "::warning::versao.js no ar ainda não mostra este commit"
          curl -sf https://pradaria.pages.dev/api/saude | tee /tmp/saude.json
          grep -q '"banco":true' /tmp/saude.json && grep -q '"sala":true' /tmp/saude.json
          curl -sf https://pradaria.pages.dev/.well-known/assetlinks.json | grep -q dev.pradaria.jogo && echo 'assetlinks ok' || echo '::warning::assetlinks.json não está no ar (o app Android vai mostrar a barra de endereço)'
          curl -s -X POST https://pradaria.pages.dev/api/entrar -H 'content-type: application/json' -d '{"nome":"ninguem_teste","senha":"xxxx"}'
