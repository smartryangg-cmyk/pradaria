# Gera o APK Android do Pradaria (app que abre o jogo do site em tela cheia).
# Precisa dos segredos do repositório ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_SENHA
# (a mesma chave sempre, para o tablet aceitar atualizações e o app abrir sem barra de endereço).
# No main, publica o APK em Releases: .../releases/latest/download/pradaria.apk
name: apk
on:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/apk.yml', 'public/.well-known/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # a chave oficial só entra no main (código revisado); nas outras branches o APK sai com chave temporária
      KEYSTORE_B64: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_B64 || '' }}
      ANDROID_KEYSTORE_SENHA: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_SENHA || '' }}
      VERSAO_CODIGO: ${{ github.run_number }}
      VERSAO_NOME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Chave de assinatura
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_SENHA" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pradaria.jks"
            echo "CHAVE_OFICIAL=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Faltam os segredos ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_SENHA. Gerando APK de teste com chave temporária (não será publicado)."
            SENHA=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/pradaria.jks" -storetype PKCS12 -alias pradaria -keyalg RSA -keysize 2048 -validity 365 -storepass "$SENHA" -keypass "$SENHA" -dname "CN=Teste"
            echo "ANDROID_KEYSTORE_SENHA=$SENHA" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_ARQUIVO=$RUNNER_TEMP/pradaria.jks" >> "$GITHUB_ENV"
      - name: Gerar APK
        run: |
          cd android && gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../pradaria.apk
      - name: Conferir assinatura
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs pradaria.apk | tee certs.txt
          if [ "$CHAVE_OFICIAL" = 1 ]; then
            FP=$(grep -m1 'SHA-256 digest' certs.txt | awk '{print $NF}' | tr a-z A-Z | sed 's/../&:/g;s/:$//')
            echo "Impressão digital: $FP"
            grep -q "$FP" public/.well-known/assetlinks.json || { echo "::error::A chave do segredo não bate com public/.well-known/assetlinks.json"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pradaria-apk
          path: pradaria.apk
      - name: Publicar em Releases
        if: github.ref == 'refs/heads/main' && env.CHAVE_OFICIAL == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-v$VERSAO_NOME
          gh release create "$TAG" pradaria.apk --title "Pradaria para Android $VERSAO_NOME" \
            --notes "Baixe o pradaria.apk no tablet Android e toque nele para instalar. O jogo se atualiza sozinho pelo site; só precisa baixar o APK de novo quando aparecer um novo aqui." --latest
