# Gera os APKs Android do Pradaria: pradaria.apk (tablet/celular, abre o jogo do site em tela cheia)
# e pradaria-tv.apk (Android TV / TV Box, abre a versão da TV /tv).
# Precisa dos segredos do repositório ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_SENHA
# (a mesma chave sempre, para o tablet aceitar atualizações e o app abrir sem barra de endereço).
# No main, publica os dois em Releases: .../releases/latest/download/pradaria.apk e pradaria-tv.apk
# O job teste-tv instala o app da TV num emulador de Android TV e confere de verdade (fotos no artefato teste-tv).
name: apk
on:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/apk.yml', 'public/.well-known/**', 'testes/teste-tv-apk*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # a chave oficial só entra no main (código revisado); nas outras branches o APK sai com chave temporária
      KEYSTORE_B64: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_B64 || '' }}
      ANDROID_KEYSTORE_SENHA: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_SENHA || '' }}
      VERSAO_CODIGO: ${{ github.run_number }}
      VERSAO_NOME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Chave de assinatura
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_SENHA" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pradaria.jks"
            echo "CHAVE_OFICIAL=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Faltam os segredos ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_SENHA. Gerando APK de teste com chave temporária (não será publicado)."
            SENHA=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/pradaria.jks" -storetype PKCS12 -alias pradaria -keyalg RSA -keysize 2048 -validity 365 -storepass "$SENHA" -keypass "$SENHA" -dname "CN=Teste"
            echo "ANDROID_KEYSTORE_SENHA=$SENHA" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_ARQUIVO=$RUNNER_TEMP/pradaria.jks" >> "$GITHUB_ENV"
      - name: Gerar APK
        run: |
          cd android && gradle :app:assembleRelease :tv:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../pradaria.apk
          cp tv/build/outputs/apk/release/tv-release.apk ../pradaria-tv.apk
      - name: Conferir assinatura
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs pradaria.apk | tee certs.txt
          "$APKSIGNER" verify --print-certs pradaria-tv.apk | tee certs-tv.txt
          # os dois apps têm que sair com a mesma chave
          [ "$(grep -m1 'SHA-256 digest' certs.txt)" = "$(grep -m1 'SHA-256 digest' certs-tv.txt)" ] || { echo "::error::pradaria-tv.apk saiu com outra chave"; exit 1; }
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          "$AAPT" dump badging pradaria-tv.apk | tee badging-tv.txt
          grep -q "leanback-launchable-activity" badging-tv.txt || { echo "::error::app da TV não aparece no menu da Android TV"; exit 1; }
          if [ "$CHAVE_OFICIAL" = 1 ]; then
            FP=$(grep -m1 'SHA-256 digest' certs.txt | awk '{print $NF}' | tr a-z A-Z | sed 's/../&:/g;s/:$//')
            echo "Impressão digital: $FP"
            grep -q "$FP" public/.well-known/assetlinks.json || { echo "::error::A chave do segredo não bate com public/.well-known/assetlinks.json"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pradaria-apk
          path: |
            pradaria.apk
            pradaria-tv.apk
      - name: Publicar em Releases
        if: github.ref == 'refs/heads/main' && env.CHAVE_OFICIAL == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-v$VERSAO_NOME
          gh release create "$TAG" pradaria.apk pradaria-tv.apk --title "Pradaria para Android $VERSAO_NOME" \
            --notes "Tablet e celular: baixe o pradaria.apk e toque nele para instalar. TV (Android TV / TV Box): instale o pradaria-tv.apk. O jogo se atualiza sozinho pelo site; só precisa baixar o APK de novo quando aparecer um novo aqui." --latest

  # Teste de verdade do app da TV: emulador de Android TV abrindo o site publicado
  teste-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: APK da TV de teste (chave temporária, WebView aberto para o teste)
        env:
          DEPURAR_WEB: '1'
        run: |
          SENHA=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/teste.jks" -storetype PKCS12 -alias pradaria -keyalg RSA -keysize 2048 -validity 30 -storepass "$SENHA" -keypass "$SENHA" -dname "CN=Teste"
          export ANDROID_KEYSTORE_ARQUIVO=$RUNNER_TEMP/teste.jks ANDROID_KEYSTORE_SENHA=$SENHA
          cd android && gradle :tv:assembleRelease --no-daemon
          cp tv/build/outputs/apk/release/tv-release.apk ../pradaria-tv-teste.apk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Navegador do celular (Playwright + Chromium)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Ligar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador de Android TV + teste
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: SAIDA=$PWD/saida-tv bash testes/teste-tv-apk.sh
      - name: Fotos pequenas no registro (para conferir sem baixar o artefato)
        if: always()
        run: |
          for f in saida-tv/*.png; do
            [ -f "$f" ] || continue
            convert "$f" -resize 640x -quality 60 /tmp/p.jpg
            echo "FOTO-INICIO $(basename "$f")"; base64 -w0 /tmp/p.jpg; echo; echo "FOTO-FIM"
          done
      - name: Guardar fotos e registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-tv
          path: saida-tv/
          retention-days: 7
